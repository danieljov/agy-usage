<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agy-usage dashboard</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --table-head-bg: rgba(255, 255, 255, 0.03);
            --toggle-bg: rgba(15, 23, 42, 0.6);
            --btn-hover-bg: rgba(255, 255, 255, 0.05);
            --btn-active-bg: rgba(56, 189, 248, 0.2);
            --badge-bg: rgba(56, 189, 248, 0.15);
            --badge-disabled-bg: rgba(148, 163, 184, 0.15);
            --chart-grid: rgba(255, 255, 255, 0.05);
            --chart-tick: #94a3b8;
            --chart-boundary: rgba(255, 255, 255, 0.2);
            --chart-crosshair: rgba(148, 163, 184, 0.45);
            --chart-budget: #64748b;
            --tooltip-bg: rgba(15, 23, 42, 0.95);
            --tooltip-text: #f8fafc;
            --tooltip-border: #334155;
        }
        [data-theme="light"] {
            color-scheme: light;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-dim: #475569;
            --accent: #0284c7;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #059669;
            --table-head-bg: rgba(15, 23, 42, 0.03);
            --toggle-bg: #f1f5f9;
            --btn-hover-bg: rgba(15, 23, 42, 0.06);
            --btn-active-bg: rgba(2, 132, 199, 0.14);
            --badge-bg: rgba(2, 132, 199, 0.12);
            --badge-disabled-bg: rgba(71, 85, 105, 0.12);
            --chart-grid: rgba(15, 23, 42, 0.08);
            --chart-tick: #475569;
            --chart-boundary: rgba(15, 23, 42, 0.22);
            --chart-crosshair: rgba(71, 85, 105, 0.55);
            --chart-budget: #64748b;
            --tooltip-bg: rgba(255, 255, 255, 0.96);
            --tooltip-text: #0f172a;
            --tooltip-border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            line-height: 1.5;
        }
        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        .header-title {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.35rem 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 600; color: var(--text); }
        .meta { color: var(--text-dim); font-size: 0.875rem; }
        .header-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.3rem 0.65rem;
            border-radius: 6px;
            cursor: pointer;
            line-height: 1.2;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .header-btn:hover {
            color: var(--text);
            background: var(--btn-hover-bg);
        }
        .header-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .header-btn.active {
            background: var(--btn-active-bg);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }
        #empty-state {
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 1.125rem;
            margin: 2rem 0;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            text-align: left;
        }
        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--table-head-bg);
            color: var(--text-dim);
            font-weight: 600;
        }
        tr:last-child td { border-bottom: none; }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr;
            }
            .chart-card:last-child:nth-child(odd) {
                grid-column: 1 / -1;
            }
        }
        .chart-card {
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .chart-title {
            font-size: 1rem;
            font-weight: 600;
        }
        .range-toggle {
            display: inline-flex;
            flex-wrap: wrap;
            background: var(--toggle-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        .range-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.2;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .range-btn:hover {
            color: var(--text);
            background: var(--btn-hover-bg);
        }
        .range-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .range-btn.active {
            background: var(--btn-active-bg);
            color: var(--accent);
            font-weight: 600;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: var(--badge-bg);
            color: var(--accent);
        }
        .badge.badge-disabled {
            background: var(--badge-disabled-bg);
            color: var(--text-dim);
        }
        .chart-box {
            position: relative;
            height: 260px;
            width: 100%;
        }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            th, td { padding: 0.5rem 0.65rem; }
        }
    </style>
    <script>
        try {
            if (window.localStorage.getItem('agy-usage-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (_) {}
    </script>
    <script>/*__CHART_JS__*/</script>
    <script>/*__DATE_FNS_ADAPTER__*/</script>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>agy-usage dashboard</h1>
            <div id="gen-meta" class="meta"></div>
        </div>
        <div class="header-controls">
            <div id="global-range-toggle" class="range-toggle" role="group" aria-label="Global time range">
                <button type="button" class="range-btn" data-range="window" aria-pressed="false">Window</button>
                <button type="button" class="range-btn" data-range="5h" aria-pressed="false">5h</button>
                <button type="button" class="range-btn" data-range="24h" aria-pressed="false">24h</button>
                <button type="button" class="range-btn" data-range="7d" aria-pressed="false">7d</button>
                <button type="button" class="range-btn" data-range="30d" aria-pressed="false">30d</button>
                <button type="button" class="range-btn" data-range="all" aria-pressed="false">All</button>
            </div>
            <button type="button" id="auto-reload-btn" class="header-btn" aria-pressed="false" aria-label="Auto 60s reload" title="Auto-reload every 60s when visible">Auto 60s</button>
            <button type="button" id="theme-toggle-btn" class="header-btn" aria-pressed="false" aria-label="Light mode" title="Toggle dark/light theme">Light mode</button>
        </div>
    </header>

    <div id="empty-state" style="display: none;">
        No samples yet — run "agy-usage install-timer" or "agy-usage collect".
    </div>

    <div id="content" style="display: none;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Bucket</th>
                        <th>Left</th>
                        <th>Rate/h</th>
                        <th>Budget/h(safe)</th>
                        <th>At reset</th>
                        <th>Resets</th>
                        <th>Status</th>
                        <th>Last sample</th>
                    </tr>
                </thead>
                <tbody id="prognosis-rows"></tbody>
            </table>
        </div>

        <div class="charts-grid" id="charts-grid"></div>
    </div>

    <script>
        const data = /*__AGY_DATA__*/null;

        // Clock format detected from the user's system when the dashboard was
        // generated ("12h" | "24h"). Browsers otherwise follow their UI
        // language (e.g. en-US => AM/PM) and date-fns defaults to 12h.
        const USE_12H = !!data && data.clock === '12h';
        const TIME_OPTS = { hourCycle: USE_12H ? 'h12' : 'h23' };

        function chartTimeOptions() {
            return USE_12H
                ? {
                    displayFormats: {
                        millisecond: 'h:mm:ss.SSS a',
                        second: 'h:mm:ss a',
                        minute: 'h:mm a',
                        hour: 'h a',
                        day: 'MMM d'
                    },
                    tooltipFormat: 'MMM d, yyyy, h:mm:ss a'
                }
                : {
                    displayFormats: {
                        millisecond: 'HH:mm:ss.SSS',
                        second: 'HH:mm:ss',
                        minute: 'HH:mm',
                        hour: 'HH:mm',
                        day: 'MMM d'
                    },
                    tooltipFormat: 'MMM d, yyyy, HH:mm:ss'
                };
        }

        function statusLabel(status, emptyAt, now) {
            if (status === 'WillRunOut') {
                if (emptyAt) {
                    const emptyDate = new Date(emptyAt);
                    const nowDate = now ? new Date(now) : new Date();
                    const sec = Math.floor((emptyDate.getTime() - nowDate.getTime()) / 1000);
                    if (isNaN(sec)) return '❌ will run out';
                    if (sec <= 0) return '❌ now';
                    if (sec < 60) return '❌ in <1m';
                    if (sec < 3600) return `❌ in ${Math.floor(sec / 60)}m`;
                    if (sec < 86400) {
                        const hr = Math.floor(sec / 3600);
                        const min = Math.floor((sec % 3600) / 60);
                        return min > 0 ? `❌ in ${hr}h ${min}m` : `❌ in ${hr}h`;
                    }
                    const d = Math.floor(sec / 86400);
                    const hr = Math.floor((sec % 86400) / 3600);
                    return hr > 0 ? `❌ in ${d}d ${hr}h` : `❌ in ${d}d`;
                }
                return '❌ will run out';
            }
            if (status === 'Disabled') return '🚫 disabled';
            switch (status) {
                case 'Collecting': return '⏳ collecting';
                case 'Tight': return '⚠️ tight';
                case 'OnTrack': return '✅ on track';
                default: return status || '—';
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTimeAgo(date) {
            const sec = Math.floor((Date.now() - date.getTime()) / 1000);
            if (sec < 60) return `${sec}s ago`;
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}m ago`;
            const hr = Math.floor(min / 60);
            if (hr < 24) return `${hr}h ago`;
            return `${Math.floor(hr / 24)}d ago`;
        }

        function formatTimeUntil(date, now) {
            const nowMs = now != null ? now : Date.now();
            const sec = Math.floor((date.getTime() - nowMs) / 1000);
            if (isNaN(sec)) return '—';
            if (sec <= 0) return 'now';
            if (sec < 60) return 'in <1m';
            if (sec < 3600) return `in ${Math.floor(sec / 60)}m`;
            if (sec < 86400) {
                const hr = Math.floor(sec / 3600);
                const min = Math.floor((sec % 3600) / 60);
                return min > 0 ? `in ${hr}h ${min}m` : `in ${hr}h`;
            }
            const d = Math.floor(sec / 86400);
            const hr = Math.floor((sec % 86400) / 3600);
            return hr > 0 ? `in ${d}d ${hr}h` : `in ${d}d`;
        }

        function formatResetCell(resetTime, isDisabled, now) {
            if (isDisabled || !resetTime) return '—';
            const rDate = new Date(resetTime);
            if (isNaN(rDate.getTime())) return '—';
            const nowMs = now != null ? now : Date.now();
            if (Math.floor((rDate.getTime() - nowMs) / 1000) <= 0) return 'now';
            return `${formatTimeUntil(rDate, nowMs)} (${rDate.toLocaleTimeString(undefined, TIME_OPTS)})`;
        }

        const STORAGE_THEME = 'agy-usage-theme';
        const STORAGE_AUTO_RELOAD = 'agy-usage-auto-reload';
        const AUTO_RELOAD_MS = 60000;

        function readStorage(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (_) {
                return null;
            }
        }

        function writeStorage(key, value) {
            try {
                window.localStorage.setItem(key, value);
            } catch (_) {
                // Ignore storage failures in restricted contexts
            }
        }

        function getThemeColors() {
            const styles = getComputedStyle(document.documentElement);
            const css = (name, fallback) => styles.getPropertyValue(name).trim() || fallback;
            return {
                accent: css('--accent', '#38bdf8'),
                danger: css('--danger', '#ef4444'),
                warning: css('--warning', '#f59e0b'),
                success: css('--success', '#10b981'),
                grid: css('--chart-grid', 'rgba(255, 255, 255, 0.05)'),
                tick: css('--chart-tick', '#94a3b8'),
                boundary: css('--chart-boundary', 'rgba(255, 255, 255, 0.2)'),
                crosshair: css('--chart-crosshair', 'rgba(148, 163, 184, 0.45)'),
                budget: css('--chart-budget', '#64748b'),
                tooltipBg: css('--tooltip-bg', 'rgba(15, 23, 42, 0.95)'),
                tooltipText: css('--tooltip-text', '#f8fafc'),
                tooltipBorder: css('--tooltip-border', '#334155')
            };
        }

        const boundaryPlugin = {
            id: 'boundaries',
            beforeDraw: (chart) => {
                const boundaries = chart.options?.plugins?.boundaries || chart.config?.options?.plugins?.boundaries;
                if (boundaries?.display === false) return;
                const dates = boundaries?.dates || [];
                if (!dates.length) return;
                if (!chart.chartArea || !chart.scales?.x) return;
                const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
                ctx.save();
                ctx.strokeStyle = getThemeColors().boundary;
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                dates.forEach(timeMs => {
                    const xPos = x.getPixelForValue(timeMs);
                    if (xPos >= left && xPos <= right) {
                        ctx.beginPath();
                        ctx.moveTo(xPos, top);
                        ctx.lineTo(xPos, bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const chartInstances = [];
        const cardStates = [];
        let isSyncingCrosshair = false;

        function sliceSeriesFrom(pts, cutoffMs) {
            if (!pts || pts.length === 0) return [];
            if (cutoffMs == null || !Number.isFinite(cutoffMs)) return pts.slice();

            let lo = 0;
            let hi = pts.length;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (pts[mid].x < cutoffMs) {
                    lo = mid + 1;
                } else {
                    hi = mid;
                }
            }

            if (lo >= pts.length) return [];
            if (lo === 0 || pts[lo].x === cutoffMs) return pts.slice(lo);

            const prev = pts[lo - 1];
            const next = pts[lo];
            const dx = next.x - prev.x;
            const leftY = (dx <= 0 || prev.y === next.y)
                ? prev.y
                : prev.y + ((cutoffMs - prev.x) / dx) * (next.y - prev.y);

            return [{ x: cutoffMs, y: leftY }, ...pts.slice(lo)];
        }

        function updateDatasetPoints(ds, nextPts) {
            if (ds._decimated) {
                delete ds._decimated;
                delete ds._data;
                Object.defineProperty(ds, 'data', {
                    configurable: true,
                    enumerable: true,
                    writable: true,
                    value: nextPts
                });
            } else {
                ds.data = nextPts;
            }
        }

        const FIXED_RANGES = {
            '5h': { spanMs: 5 * 3600 * 1000, boundaries: () => true },
            '24h': { spanMs: 24 * 3600 * 1000, boundaries: () => true },
            '7d': { spanMs: 7 * 86400 * 1000, boundaries: isShort => !isShort },
            '30d': { spanMs: 30 * 86400 * 1000, boundaries: isShort => !isShort }
        };

        function applyCardRange(cardIdx, range) {
            const state = cardStates[cardIdx];
            if (!state || !state.chart) return false;
            const {
                chart,
                isShort,
                endMs,
                lastSampleMs,
                windowStartMs,
                fallbackSpanMs,
                allActualPts,
                actualDataset,
                actualPointRadius,
                toggleContainer
            } = state;

            let minX = null;
            if (range === 'window') {
                const rawWinMin = Number.isFinite(windowStartMs) ? windowStartMs : (endMs - fallbackSpanMs);
                minX = Math.min(rawWinMin, lastSampleMs);
                chart.options.scales.x.min = minX;
                chart.options.scales.x.max = endMs;
                chart.options.plugins.boundaries.display = true;
            } else if (Object.prototype.hasOwnProperty.call(FIXED_RANGES, range)) {
                const spec = FIXED_RANGES[range];
                if (endMs - spec.spanMs <= lastSampleMs) {
                    minX = endMs - spec.spanMs;
                    chart.options.scales.x.max = endMs;
                } else {
                    minX = lastSampleMs - spec.spanMs;
                    chart.options.scales.x.max = lastSampleMs;
                }
                chart.options.scales.x.min = minX;
                chart.options.plugins.boundaries.display = spec.boundaries(isShort);
            } else if (range === 'all') {
                delete chart.options.scales.x.min;
                chart.options.scales.x.max = endMs;
                chart.options.plugins.boundaries.display = false;
            } else {
                return false;
            }

            if (actualDataset) {
                const visiblePts = sliceSeriesFrom(allActualPts, minX);
                updateDatasetPoints(actualDataset, visiblePts);
                actualDataset.pointRadius = actualPointRadius(visiblePts);
            }
            chart.data.datasets.forEach(ds => {
                if (ds !== actualDataset && ds._decimated) {
                    updateDatasetPoints(ds, ds._data || ds.data);
                }
            });

            state.currentRange = range;
            if (toggleContainer) {
                toggleContainer.querySelectorAll('.range-btn').forEach(b => {
                    const isActive = b.dataset.range === range;
                    b.classList.toggle('active', isActive);
                    b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                });
            }
            clearSyncedCrosshair(null);
            chart.update('none');
            return true;
        }

        function syncGlobalRangeButtons() {
            const globalToggle = document.getElementById('global-range-toggle');
            if (!globalToggle) return;
            const activeStates = cardStates.filter(s => s && s.chart);
            const commonRange = activeStates.length > 0 && activeStates.every(s => s.currentRange === activeStates[0].currentRange)
                ? activeStates[0].currentRange
                : null;
            globalToggle.querySelectorAll('.range-btn').forEach(b => {
                const isActive = commonRange !== null && b.dataset.range === commonRange;
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });
        }

        function applyTheme(theme, themeBtn) {
            const isLight = theme === 'light';
            if (isLight) {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            if (themeBtn) {
                themeBtn.classList.toggle('active', isLight);
                themeBtn.setAttribute('aria-pressed', isLight ? 'true' : 'false');
            }
            const colors = getThemeColors();
            chartInstances.forEach(chart => {
                const xScale = chart.options.scales?.x;
                const yScale = chart.options.scales?.y;
                if (xScale) {
                    xScale.grid.color = colors.grid;
                    xScale.ticks.color = colors.tick;
                }
                if (yScale) {
                    yScale.grid.color = colors.grid;
                    yScale.ticks.color = colors.tick;
                }
                if (chart.options.plugins?.legend?.labels) {
                    chart.options.plugins.legend.labels.color = colors.tick;
                }
                if (chart.options.plugins?.tooltip) {
                    chart.options.plugins.tooltip.backgroundColor = colors.tooltipBg;
                    chart.options.plugins.tooltip.titleColor = colors.tooltipText;
                    chart.options.plugins.tooltip.bodyColor = colors.tooltipText;
                    chart.options.plugins.tooltip.borderColor = colors.tooltipBorder;
                }
                chart.data.datasets.forEach(ds => {
                    if (ds.label === 'Actual') {
                        ds.borderColor = colors.accent;
                        ds.backgroundColor = colors.accent;
                    } else if (ds.label === 'Budget') {
                        ds.borderColor = colors.budget;
                    } else if (ds.label === 'Projection') {
                        const st = chart.$prognosisStatus;
                        ds.borderColor = st === 'WillRunOut' ? colors.danger : (st === 'Tight' ? colors.warning : colors.success);
                    }
                });
                chart.update('none');
            });
        }

        function findNearestActualIndex(pts, targetMs) {
            if (!pts || pts.length === 0) return -1;
            let lo = 0;
            let hi = pts.length - 1;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (pts[mid].x < targetMs) {
                    lo = mid + 1;
                } else {
                    hi = mid;
                }
            }
            if (lo > 0 && Math.abs(pts[lo - 1].x - targetMs) <= Math.abs(pts[lo].x - targetMs)) {
                return lo - 1;
            }
            return lo;
        }

        function clearSyncedCrosshair(sourceChart) {
            if (isSyncingCrosshair) return;
            isSyncingCrosshair = true;
            try {
                chartInstances.forEach(sibling => {
                    const hadCrosshair = sibling.$crosshairTimeMs != null;
                    sibling.$crosshairTimeMs = null;
                    if (sibling === sourceChart) return;
                    const hadActive = sibling.getActiveElements && sibling.getActiveElements().length > 0;
                    if (hadCrosshair || hadActive) {
                        sibling.setActiveElements([]);
                        sibling.tooltip?.setActiveElements([], { x: 0, y: 0 });
                        sibling.update('none');
                    }
                });
            } finally {
                isSyncingCrosshair = false;
            }
        }

        function syncCrosshair(sourceChart, targetMs) {
            if (isSyncingCrosshair) return;
            isSyncingCrosshair = true;
            try {
                chartInstances.forEach(sibling => {
                    if (sibling === sourceChart) return;
                    const xScale = sibling.scales?.x;
                    const area = sibling.chartArea;
                    if (!xScale || !area || targetMs < xScale.min || targetMs > xScale.max) {
                        if (sibling.$crosshairTimeMs != null || (sibling.getActiveElements && sibling.getActiveElements().length > 0)) {
                            sibling.$crosshairTimeMs = null;
                            sibling.setActiveElements([]);
                            sibling.tooltip?.setActiveElements([], { x: 0, y: 0 });
                            sibling.update('none');
                        }
                        return;
                    }
                    sibling.$crosshairTimeMs = targetMs;
                    let activeElements = [];
                    let tooltipPos = { x: xScale.getPixelForValue(targetMs), y: area.top };
                    const actualIdx = sibling.data.datasets.findIndex(d => d.label === 'Actual');
                    if (actualIdx !== -1) {
                        const pts = sibling.data.datasets[actualIdx].data || [];
                        const nearestIdx = findNearestActualIndex(pts, targetMs);
                        const spanMs = Math.max(1, xScale.max - xScale.min);
                        const maxSnapMs = Math.min(15 * 60 * 1000, (xScale.max - xScale.min) * 0.05);
                        if (nearestIdx !== -1 && Math.abs(pts[nearestIdx].x - targetMs) <= Math.max(0, maxSnapMs) && spanMs > 0) {
                            const meta = sibling.getDatasetMeta(actualIdx);
                            const el = meta?.data?.[nearestIdx];
                            if (el && Number.isFinite(el.x) && Number.isFinite(el.y) && el.x >= area.left && el.x <= area.right) {
                                activeElements = [{ datasetIndex: actualIdx, index: nearestIdx }];
                                tooltipPos = { x: el.x, y: el.y };
                            }
                        }
                    }
                    sibling.setActiveElements(activeElements);
                    sibling.tooltip?.setActiveElements(activeElements, tooltipPos);
                    sibling.update('none');
                });
            } finally {
                isSyncingCrosshair = false;
            }
        }

        const crosshairSyncPlugin = {
            id: 'crosshairSync',
            afterEvent: (chart, args) => {
                if (isSyncingCrosshair) return;
                const { event, inChartArea } = args;
                if (!event) return;
                if (event.type === 'mouseout' || !inChartArea || event.x == null) {
                    if (chart.$crosshairTimeMs != null) {
                        chart.$crosshairTimeMs = null;
                        args.changed = true;
                    }
                    clearSyncedCrosshair(chart);
                    return;
                }
                if (event.type !== 'mousemove' && event.type !== 'touchmove' && event.type !== 'touchstart' && event.type !== 'click') {
                    return;
                }
                const xScale = chart.scales?.x;
                if (!xScale) return;
                const targetMs = xScale.getValueForPixel(event.x);
                if (!Number.isFinite(targetMs)) return;
                chart.$crosshairTimeMs = targetMs;
                args.changed = true;
                syncCrosshair(chart, targetMs);
            },
            afterDraw: (chart) => {
                const timeMs = chart.$crosshairTimeMs;
                if (timeMs == null || !chart.chartArea || !chart.scales?.x) return;
                const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
                const xPos = x.getPixelForValue(timeMs);
                if (!Number.isFinite(xPos) || xPos < left || xPos > right) return;
                ctx.save();
                ctx.strokeStyle = getThemeColors().crosshair;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(xPos, top);
                ctx.lineTo(xPos, bottom);
                ctx.stroke();
                ctx.restore();
            }
        };

        if (typeof Chart !== 'undefined') {
            Chart.register(boundaryPlugin, crosshairSyncPlugin);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const emptyEl = document.getElementById('empty-state');
            const contentEl = document.getElementById('content');
            const metaEl = document.getElementById('gen-meta');
            const globalRangeEl = document.getElementById('global-range-toggle');
            const autoReloadBtn = document.getElementById('auto-reload-btn');
            const themeBtn = document.getElementById('theme-toggle-btn');

            let currentTheme = readStorage(STORAGE_THEME) === 'light' ? 'light' : 'dark';
            applyTheme(currentTheme, themeBtn);
            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                    writeStorage(STORAGE_THEME, currentTheme);
                    applyTheme(currentTheme, themeBtn);
                });
            }

            let autoReloadEnabled = readStorage(STORAGE_AUTO_RELOAD) === 'true';
            let autoReloadTimer = null;

            function stopAutoReloadTimer() {
                if (autoReloadTimer !== null) {
                    clearInterval(autoReloadTimer);
                    autoReloadTimer = null;
                }
            }

            function scheduleAutoReload() {
                stopAutoReloadTimer();
                if (!autoReloadEnabled) return;
                if (document.visibilityState !== 'visible') return;
                autoReloadTimer = setInterval(() => {
                    if (autoReloadEnabled && document.visibilityState === 'visible') {
                        window.location.reload();
                    }
                }, AUTO_RELOAD_MS);
            }

            function syncAutoReloadButton() {
                if (!autoReloadBtn) return;
                autoReloadBtn.classList.toggle('active', autoReloadEnabled);
                autoReloadBtn.setAttribute('aria-pressed', autoReloadEnabled ? 'true' : 'false');
            }

            syncAutoReloadButton();
            scheduleAutoReload();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    scheduleAutoReload();
                } else {
                    stopAutoReloadTimer();
                }
            });
            if (autoReloadBtn) {
                autoReloadBtn.addEventListener('click', () => {
                    autoReloadEnabled = !autoReloadEnabled;
                    writeStorage(STORAGE_AUTO_RELOAD, autoReloadEnabled ? 'true' : 'false');
                    syncAutoReloadButton();
                    scheduleAutoReload();
                });
            }

            if (!data || !data.reports || data.reports.length === 0) {
                if (globalRangeEl) globalRangeEl.style.display = 'none';
                emptyEl.style.display = 'block';
                contentEl.style.display = 'none';
                return;
            }

            emptyEl.style.display = 'none';
            contentEl.style.display = 'block';

            const genDate = new Date(data.generated_at);
            metaEl.textContent = `Generated: ${genDate.toLocaleString(undefined, TIME_OPTS)} (${formatTimeAgo(genDate)})`;

            const tbody = document.getElementById('prognosis-rows');
            const grid = document.getElementById('charts-grid');

            data.reports.forEach((rep, idx) => {
                const p = rep.prognosis;
                const isDis = p.status === 'Disabled';
                const title = rep.label;

                const leftStr = isDis ? '—' : `${(p.remaining_now * 100).toFixed(1)}%`;
                const rateStr = (isDis || p.rate_per_h == null) ? '—' : `${(p.rate_per_h * 100).toFixed(2)}%/h`;
                const safeStr = (isDis || p.safe_rate_per_h == null) ? '—' : `${(p.safe_rate_per_h * 100).toFixed(2)}%/h`;
                const atResetStr = (isDis || p.at_reset == null) ? '—' : `${(p.at_reset * 100).toFixed(1)}%`;
                const resetsStr = formatResetCell(rep.reset_time, isDis, Date.now());
                const statusStr = statusLabel(p.status, p.empty_at, Date.now());
                const lastDate = new Date(p.last_sample);
                const lastSampleStr = `${lastDate.toLocaleTimeString(undefined, TIME_OPTS)} (${formatTimeAgo(lastDate)})`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(title)}</strong></td>
                    <td>${escapeHtml(leftStr)}</td>
                    <td>${rateStr}</td>
                    <td>${safeStr}</td>
                    <td>${atResetStr}</td>
                    <td>${escapeHtml(resetsStr)}</td>
                    <td>${statusStr}</td>
                    <td>${lastSampleStr}</td>
                `;
                tbody.appendChild(tr);

                const badgeText = isDis ? 'disabled' : `${leftStr} left`;
                const badgeClass = isDis ? 'badge badge-disabled' : 'badge';

                const isShort = rep.window_secs != null && rep.window_secs < 86400;
                const rangeHtml = isDis ? '' : (isShort ? `
                    <div class="range-toggle" role="group" aria-label="Time range" data-idx="${idx}">
                        <button type="button" class="range-btn" data-range="window" aria-pressed="false">Window</button>
                        <button type="button" class="range-btn active" data-range="5h" aria-pressed="true">5h</button>
                        <button type="button" class="range-btn" data-range="24h" aria-pressed="false">24h</button>
                        <button type="button" class="range-btn" data-range="7d" aria-pressed="false">7d</button>
                        <button type="button" class="range-btn" data-range="30d" aria-pressed="false">30d</button>
                        <button type="button" class="range-btn" data-range="all" aria-pressed="false">All</button>
                    </div>
                ` : `
                    <div class="range-toggle" role="group" aria-label="Time range" data-idx="${idx}">
                        <button type="button" class="range-btn" data-range="window" aria-pressed="false">Window</button>
                        <button type="button" class="range-btn" data-range="5h" aria-pressed="false">5h</button>
                        <button type="button" class="range-btn" data-range="24h" aria-pressed="false">24h</button>
                        <button type="button" class="range-btn active" data-range="7d" aria-pressed="true">7d</button>
                        <button type="button" class="range-btn" data-range="30d" aria-pressed="false">30d</button>
                        <button type="button" class="range-btn" data-range="all" aria-pressed="false">All</button>
                    </div>
                `);

                const card = document.createElement('div');
                card.className = 'chart-card';
                card.innerHTML = `
                    <div class="chart-header">
                        <div class="chart-title">${escapeHtml(title)}</div>
                        ${rangeHtml}
                        <span class="${badgeClass}">${escapeHtml(badgeText)}</span>
                    </div>
                    <div class="chart-box">
                        <canvas class="bucket-chart" data-idx="${idx}"></canvas>
                    </div>
                `;
                grid.appendChild(card);

                const canvas = card.querySelector('canvas');
                const datasets = [];
                const themeColors = getThemeColors();

                const nowMs = !isNaN(genDate.getTime()) ? genDate.getTime() : Date.now();
                const resetMs = rep.reset_time ? new Date(rep.reset_time).getTime() : NaN;
                const rawLastMs = p.last_sample ? new Date(p.last_sample).getTime() : NaN;
                const lastSampleMs = !isNaN(rawLastMs) ? rawLastMs : nowMs;
                const endMs = (!isNaN(resetMs) && resetMs > nowMs) ? resetMs : Math.max(nowMs, lastSampleMs);
                const rawMin = endMs - (isShort ? 5 * 3600 * 1000 : 7 * 86400 * 1000);
                const initialMin = Math.min(rawMin, lastSampleMs);
                const windowStartMs = rep.window_start ? new Date(rep.window_start).getTime() : NaN;
                const fallbackSpanMs = (rep.window_secs != null && rep.window_secs > 0)
                    ? rep.window_secs * 1000
                    : (isShort ? 5 * 3600 * 1000 : 7 * 86400 * 1000);

                // Actual series
                const allActualPts = (rep.series || []).map(pt => ({ x: pt[0], y: pt[1] * 100 }));
                const actualPointRadius = pts => (pts.length === 1 ? 2 : 0);
                let actualDataset = null;
                if (allActualPts.length > 0) {
                    const initialActualPts = sliceSeriesFrom(allActualPts, initialMin);
                    actualDataset = {
                        label: 'Actual',
                        data: initialActualPts,
                        borderColor: themeColors.accent,
                        backgroundColor: themeColors.accent,
                        borderWidth: 2,
                        borderJoinStyle: 'round',
                        borderCapStyle: 'round',
                        pointRadius: actualPointRadius(initialActualPts),
                        pointHoverRadius: 4,
                        tension: 0,
                    };
                    datasets.push(actualDataset);
                }

                // Budget line
                if (rep.window_start && rep.reset_time) {
                    datasets.push({
                        label: 'Budget',
                        data: [
                            { x: new Date(rep.window_start).getTime(), y: 100 },
                            { x: new Date(rep.reset_time).getTime(), y: 0 }
                        ],
                        borderColor: themeColors.budget,
                        borderWidth: 1.5,
                        borderDash: [4, 4],
                        pointRadius: 0,
                    });
                }

                // Projection
                if (p.rate_per_h != null && p.rate_per_h >= 0) {
                    const startX = new Date(p.last_sample).getTime();
                    const startY = p.remaining_now * 100;
                    let endX, endY;
                    if (p.empty_at) {
                        endX = new Date(p.empty_at).getTime();
                        endY = 0;
                    } else {
                        endX = new Date(p.reset_time).getTime();
                        endY = (p.at_reset || 0) * 100;
                    }
                    if (endX > startX) {
                        const projColor = p.status === 'WillRunOut' ? themeColors.danger : (p.status === 'Tight' ? themeColors.warning : themeColors.success);
                        datasets.push({
                            label: 'Projection',
                            data: [
                                { x: startX, y: startY },
                                { x: endX, y: endY }
                            ],
                            borderColor: projColor,
                            borderWidth: 2,
                            borderDash: [6, 4],
                            pointRadius: 0,
                        });
                    }
                }

                if (isDis) {
                    const box = card.querySelector('.chart-box');
                    box.style.display = 'flex';
                    box.style.flexDirection = 'column';
                    box.style.alignItems = 'center';
                    box.style.justifyContent = 'center';
                    box.style.color = 'var(--text-dim)';
                    box.style.fontSize = '0.95rem';
                    box.style.border = '1px dashed var(--border)';
                    box.style.borderRadius = '6px';
                    box.innerHTML = '<strong style="color:var(--text);font-size:1.05rem;margin-bottom:0.25rem;">Disabled</strong><span>Weekly limit reached</span>';
                    cardStates[idx] = null;
                } else if (typeof Chart !== 'undefined') {
                    const chart = new Chart(canvas, {
                        type: 'line',
                        data: { datasets },
                        options: {
                            parsing: false,
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'nearest', axis: 'x', intersect: false },
                            scales: {
                                x: {
                                    type: 'time',
                                    time: chartTimeOptions(),
                                    min: initialMin,
                                    max: endMs,
                                    grid: { color: themeColors.grid },
                                    ticks: { color: themeColors.tick }
                                },
                                y: {
                                    min: 0,
                                    max: 100,
                                    grid: { color: themeColors.grid },
                                    ticks: {
                                        color: themeColors.tick,
                                        callback: v => v + '%'
                                    }
                                }
                            },
                            plugins: {
                                decimation: {
                                    enabled: true,
                                    algorithm: 'min-max',
                                },
                                tooltip: {
                                    backgroundColor: themeColors.tooltipBg,
                                    titleColor: themeColors.tooltipText,
                                    bodyColor: themeColors.tooltipText,
                                    borderColor: themeColors.tooltipBorder,
                                    borderWidth: 1,
                                    callbacks: {
                                        label: (ctx) => {
                                            const label = ctx.dataset.label ? `${ctx.dataset.label}: ` : '';
                                            return ctx.parsed?.y != null ? `${label}${ctx.parsed.y.toFixed(1)}%` : label;
                                        }
                                    }
                                },
                                legend: {
                                    labels: { color: themeColors.tick, boxWidth: 12 }
                                },
                                boundaries: {
                                    display: true,
                                    dates: Array.from(new Set([
                                        ...(rep.boundaries || []),
                                        ...(rep.reset_time ? [rep.reset_time] : [])
                                    ])).map(d => new Date(d).getTime()).filter(t => !isNaN(t))
                                }
                            }
                        }
                    });
                    chart.$prognosisStatus = p.status;
                    chartInstances.push(chart);

                    const toggleContainer = card.querySelector('.range-toggle');
                    cardStates[idx] = {
                        chart,
                        isShort,
                        endMs,
                        lastSampleMs,
                        windowStartMs,
                        fallbackSpanMs,
                        allActualPts,
                        actualDataset,
                        actualPointRadius,
                        toggleContainer,
                        currentRange: isShort ? '5h' : '7d'
                    };

                    if (toggleContainer) {
                        toggleContainer.addEventListener('click', (e) => {
                            const btn = e.target.closest('.range-btn');
                            if (!btn || btn.classList.contains('active')) return;
                            if (applyCardRange(idx, btn.dataset.range)) {
                                syncGlobalRangeButtons();
                            }
                        });
                    }
                } else {
                    const box = card.querySelector('.chart-box');
                    box.style.display = 'flex';
                    box.style.alignItems = 'center';
                    box.style.justifyContent = 'center';
                    box.style.color = 'var(--text-dim)';
                    box.style.fontSize = '0.875rem';
                    box.style.border = '1px dashed var(--border)';
                    box.style.borderRadius = '4px';
                    box.textContent = 'Charts unavailable offline (Chart.js CDN unreached)';
                    cardStates[idx] = null;
                }
            });

            if (globalRangeEl) {
                if (chartInstances.length === 0) {
                    globalRangeEl.style.display = 'none';
                } else {
                    syncGlobalRangeButtons();
                    globalRangeEl.addEventListener('click', (e) => {
                        const btn = e.target.closest('.range-btn');
                        if (!btn) return;
                        const range = btn.dataset.range;
                        let changed = false;
                        cardStates.forEach((state, idx) => {
                            if (state && state.chart && applyCardRange(idx, range)) {
                                changed = true;
                            }
                        });
                        if (changed) {
                            syncGlobalRangeButtons();
                        }
                    });
                }
            }

            function updateRelativeTimes() {
                const now = Date.now();
                if (metaEl && data && data.generated_at) {
                    const gDate = new Date(data.generated_at);
                    metaEl.textContent = `Generated: ${gDate.toLocaleString(undefined, TIME_OPTS)} (${formatTimeAgo(gDate)})`;
                }
                const rows = tbody.querySelectorAll('tr');
                rows.forEach((tr, i) => {
                    const rep = data.reports && data.reports[i];
                    if (!rep) return;
                    const p = rep.prognosis;
                    if (tr.cells[5]) {
                        tr.cells[5].textContent = formatResetCell(rep.reset_time, p.status === 'Disabled', now);
                    }
                    if (tr.cells[6]) {
                        tr.cells[6].textContent = statusLabel(p.status, p.empty_at, now);
                    }
                    if (tr.cells[7]) {
                        const lDate = new Date(p.last_sample);
                        tr.cells[7].textContent = `${lDate.toLocaleTimeString(undefined, TIME_OPTS)} (${formatTimeAgo(lDate)})`;
                    }
                });
            }
            setInterval(updateRelativeTimes, 30000);
        });
    </script>
</body>
</html>
