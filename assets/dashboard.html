<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agy-usage dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            line-height: 1.5;
        }
        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 600; color: var(--text); }
        .meta { color: var(--text-dim); font-size: 0.875rem; }
        #empty-state {
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 1.125rem;
            margin: 2rem 0;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            text-align: left;
        }
        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            font-weight: 600;
        }
        tr:last-child td { border-bottom: none; }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr;
            }
            .chart-card:last-child:nth-child(odd) {
                grid-column: 1 / -1;
            }
        }
        .chart-card {
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .chart-title {
            font-size: 1rem;
            font-weight: 600;
        }
        .range-toggle {
            display: inline-flex;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        .range-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.2;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .range-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .range-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .range-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            font-weight: 600;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }
        .badge.badge-disabled {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-dim);
        }
        .chart-box {
            position: relative;
            height: 260px;
            width: 100%;
        }
    </style>
    <script>/*__CHART_JS__*/</script>
    <script>/*__DATE_FNS_ADAPTER__*/</script>
</head>
<body>
    <header>
        <h1>agy-usage dashboard</h1>
        <div id="gen-meta" class="meta"></div>
    </header>

    <div id="empty-state" style="display: none;">
        No samples yet — run "agy-usage install-timer" or "agy-usage collect".
    </div>

    <div id="content" style="display: none;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Bucket</th>
                        <th>Left</th>
                        <th>Rate/h</th>
                        <th>Budget/h(safe)</th>
                        <th>At reset</th>
                        <th>Resets</th>
                        <th>Status</th>
                        <th>Last sample</th>
                    </tr>
                </thead>
                <tbody id="prognosis-rows"></tbody>
            </table>
        </div>

        <div class="charts-grid" id="charts-grid"></div>
    </div>

    <script>
        const data = /*__AGY_DATA__*/null;

        // Clock format detected from the user's system when the dashboard was
        // generated ("12h" | "24h"). Browsers otherwise follow their UI
        // language (e.g. en-US => AM/PM) and date-fns defaults to 12h.
        const USE_12H = !!data && data.clock === '12h';
        const TIME_OPTS = { hourCycle: USE_12H ? 'h12' : 'h23' };

        function chartTimeOptions() {
            return USE_12H
                ? {
                    displayFormats: {
                        millisecond: 'h:mm:ss.SSS a',
                        second: 'h:mm:ss a',
                        minute: 'h:mm a',
                        hour: 'h a',
                        day: 'MMM d'
                    },
                    tooltipFormat: 'MMM d, yyyy, h:mm:ss a'
                }
                : {
                    displayFormats: {
                        millisecond: 'HH:mm:ss.SSS',
                        second: 'HH:mm:ss',
                        minute: 'HH:mm',
                        hour: 'HH:mm',
                        day: 'MMM d'
                    },
                    tooltipFormat: 'MMM d, yyyy, HH:mm:ss'
                };
        }

        function statusLabel(status, emptyAt, now) {
            if (status === 'WillRunOut') {
                if (emptyAt) {
                    const emptyDate = new Date(emptyAt);
                    const nowDate = now ? new Date(now) : new Date();
                    const sec = Math.floor((emptyDate.getTime() - nowDate.getTime()) / 1000);
                    if (isNaN(sec)) return '❌ will run out';
                    if (sec <= 0) return '❌ now';
                    if (sec < 60) return '❌ in <1m';
                    if (sec < 3600) return `❌ in ${Math.floor(sec / 60)}m`;
                    if (sec < 86400) {
                        const hr = Math.floor(sec / 3600);
                        const min = Math.floor((sec % 3600) / 60);
                        return min > 0 ? `❌ in ${hr}h ${min}m` : `❌ in ${hr}h`;
                    }
                    const d = Math.floor(sec / 86400);
                    const hr = Math.floor((sec % 86400) / 3600);
                    return hr > 0 ? `❌ in ${d}d ${hr}h` : `❌ in ${d}d`;
                }
                return '❌ will run out';
            }
            if (status === 'Disabled') return '🚫 disabled';
            switch (status) {
                case 'Collecting': return '⏳ collecting';
                case 'Tight': return '⚠️ tight';
                case 'OnTrack': return '✅ on track';
                default: return status || '—';
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTimeAgo(date) {
            const sec = Math.floor((Date.now() - date.getTime()) / 1000);
            if (sec < 60) return `${sec}s ago`;
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}m ago`;
            const hr = Math.floor(min / 60);
            if (hr < 24) return `${hr}h ago`;
            return `${Math.floor(hr / 24)}d ago`;
        }

        function formatTimeUntil(date, now) {
            const nowMs = now != null ? now : Date.now();
            const sec = Math.floor((date.getTime() - nowMs) / 1000);
            if (isNaN(sec)) return '—';
            if (sec <= 0) return 'now';
            if (sec < 60) return 'in <1m';
            if (sec < 3600) return `in ${Math.floor(sec / 60)}m`;
            if (sec < 86400) {
                const hr = Math.floor(sec / 3600);
                const min = Math.floor((sec % 3600) / 60);
                return min > 0 ? `in ${hr}h ${min}m` : `in ${hr}h`;
            }
            const d = Math.floor(sec / 86400);
            const hr = Math.floor((sec % 86400) / 3600);
            return hr > 0 ? `in ${d}d ${hr}h` : `in ${d}d`;
        }

        function formatResetCell(resetTime, isDisabled, now) {
            if (isDisabled || !resetTime) return '—';
            const rDate = new Date(resetTime);
            if (isNaN(rDate.getTime())) return '—';
            const nowMs = now != null ? now : Date.now();
            if (Math.floor((rDate.getTime() - nowMs) / 1000) <= 0) return 'now';
            return `${formatTimeUntil(rDate, nowMs)} (${rDate.toLocaleTimeString(undefined, TIME_OPTS)})`;
        }

        const boundaryPlugin = {
            id: 'boundaries',
            beforeDraw: (chart) => {
                const boundaries = chart.options?.plugins?.boundaries || chart.config?.options?.plugins?.boundaries;
                if (boundaries?.display === false) return;
                const dates = boundaries?.dates || [];
                if (!dates.length) return;
                if (!chart.chartArea || !chart.scales?.x) return;
                const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                dates.forEach(timeMs => {
                    const xPos = x.getPixelForValue(timeMs);
                    if (xPos >= left && xPos <= right) {
                        ctx.beginPath();
                        ctx.moveTo(xPos, top);
                        ctx.lineTo(xPos, bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const chartInstances = [];
        let isSyncingCrosshair = false;

        function findNearestActualIndex(pts, targetMs) {
            if (!pts || pts.length === 0) return -1;
            let lo = 0;
            let hi = pts.length - 1;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (pts[mid].x < targetMs) {
                    lo = mid + 1;
                } else {
                    hi = mid;
                }
            }
            if (lo > 0 && Math.abs(pts[lo - 1].x - targetMs) <= Math.abs(pts[lo].x - targetMs)) {
                return lo - 1;
            }
            return lo;
        }

        function clearSyncedCrosshair(sourceChart) {
            if (isSyncingCrosshair) return;
            isSyncingCrosshair = true;
            try {
                chartInstances.forEach(sibling => {
                    const hadCrosshair = sibling.$crosshairTimeMs != null;
                    sibling.$crosshairTimeMs = null;
                    if (sibling === sourceChart) return;
                    const hadActive = sibling.getActiveElements && sibling.getActiveElements().length > 0;
                    if (hadCrosshair || hadActive) {
                        sibling.setActiveElements([]);
                        sibling.tooltip?.setActiveElements([], { x: 0, y: 0 });
                        sibling.update('none');
                    }
                });
            } finally {
                isSyncingCrosshair = false;
            }
        }

        function syncCrosshair(sourceChart, targetMs) {
            if (isSyncingCrosshair) return;
            isSyncingCrosshair = true;
            try {
                chartInstances.forEach(sibling => {
                    if (sibling === sourceChart) return;
                    const xScale = sibling.scales?.x;
                    const area = sibling.chartArea;
                    if (!xScale || !area || targetMs < xScale.min || targetMs > xScale.max) {
                        if (sibling.$crosshairTimeMs != null || (sibling.getActiveElements && sibling.getActiveElements().length > 0)) {
                            sibling.$crosshairTimeMs = null;
                            sibling.setActiveElements([]);
                            sibling.tooltip?.setActiveElements([], { x: 0, y: 0 });
                            sibling.update('none');
                        }
                        return;
                    }
                    sibling.$crosshairTimeMs = targetMs;
                    let activeElements = [];
                    let tooltipPos = { x: xScale.getPixelForValue(targetMs), y: area.top };
                    const actualIdx = sibling.data.datasets.findIndex(d => d.label === 'Actual');
                    if (actualIdx !== -1) {
                        const pts = sibling.data.datasets[actualIdx].data || [];
                        const nearestIdx = findNearestActualIndex(pts, targetMs);
                        const spanMs = Math.max(1, xScale.max - xScale.min);
                        const maxSnapMs = Math.min(15 * 60 * 1000, (xScale.max - xScale.min) * 0.05);
                        if (nearestIdx !== -1 && Math.abs(pts[nearestIdx].x - targetMs) <= Math.max(0, maxSnapMs) && spanMs > 0) {
                            const meta = sibling.getDatasetMeta(actualIdx);
                            const el = meta?.data?.[nearestIdx];
                            if (el && Number.isFinite(el.x) && Number.isFinite(el.y) && el.x >= area.left && el.x <= area.right) {
                                activeElements = [{ datasetIndex: actualIdx, index: nearestIdx }];
                                tooltipPos = { x: el.x, y: el.y };
                            }
                        }
                    }
                    sibling.setActiveElements(activeElements);
                    sibling.tooltip?.setActiveElements(activeElements, tooltipPos);
                    sibling.update('none');
                });
            } finally {
                isSyncingCrosshair = false;
            }
        }

        const crosshairSyncPlugin = {
            id: 'crosshairSync',
            afterEvent: (chart, args) => {
                if (isSyncingCrosshair) return;
                const { event, inChartArea } = args;
                if (!event) return;
                if (event.type === 'mouseout' || !inChartArea || event.x == null) {
                    if (chart.$crosshairTimeMs != null) {
                        chart.$crosshairTimeMs = null;
                        args.changed = true;
                    }
                    clearSyncedCrosshair(chart);
                    return;
                }
                if (event.type !== 'mousemove' && event.type !== 'touchmove' && event.type !== 'touchstart' && event.type !== 'click') {
                    return;
                }
                const xScale = chart.scales?.x;
                if (!xScale) return;
                const targetMs = xScale.getValueForPixel(event.x);
                if (!Number.isFinite(targetMs)) return;
                chart.$crosshairTimeMs = targetMs;
                args.changed = true;
                syncCrosshair(chart, targetMs);
            },
            afterDraw: (chart) => {
                const timeMs = chart.$crosshairTimeMs;
                if (timeMs == null || !chart.chartArea || !chart.scales?.x) return;
                const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
                const xPos = x.getPixelForValue(timeMs);
                if (!Number.isFinite(xPos) || xPos < left || xPos > right) return;
                ctx.save();
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(xPos, top);
                ctx.lineTo(xPos, bottom);
                ctx.stroke();
                ctx.restore();
            }
        };

        if (typeof Chart !== 'undefined') {
            Chart.register(boundaryPlugin, crosshairSyncPlugin);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const emptyEl = document.getElementById('empty-state');
            const contentEl = document.getElementById('content');
            const metaEl = document.getElementById('gen-meta');

            if (!data || !data.reports || data.reports.length === 0) {
                emptyEl.style.display = 'block';
                contentEl.style.display = 'none';
                return;
            }

            emptyEl.style.display = 'none';
            contentEl.style.display = 'block';

            const genDate = new Date(data.generated_at);
            metaEl.textContent = `Generated: ${genDate.toLocaleString(undefined, TIME_OPTS)} (${formatTimeAgo(genDate)})`;

            const tbody = document.getElementById('prognosis-rows');
            const grid = document.getElementById('charts-grid');

            data.reports.forEach((rep, idx) => {
                const p = rep.prognosis;
                const isDis = p.status === 'Disabled';
                const title = rep.label;

                const leftStr = isDis ? '—' : `${(p.remaining_now * 100).toFixed(1)}%`;
                const rateStr = (isDis || p.rate_per_h == null) ? '—' : `${(p.rate_per_h * 100).toFixed(2)}%/h`;
                const safeStr = (isDis || p.safe_rate_per_h == null) ? '—' : `${(p.safe_rate_per_h * 100).toFixed(2)}%/h`;
                const atResetStr = (isDis || p.at_reset == null) ? '—' : `${(p.at_reset * 100).toFixed(1)}%`;
                const resetsStr = formatResetCell(rep.reset_time, isDis, Date.now());
                const statusStr = statusLabel(p.status, p.empty_at, Date.now());
                const lastDate = new Date(p.last_sample);
                const lastSampleStr = `${lastDate.toLocaleTimeString(undefined, TIME_OPTS)} (${formatTimeAgo(lastDate)})`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(title)}</strong></td>
                    <td>${escapeHtml(leftStr)}</td>
                    <td>${rateStr}</td>
                    <td>${safeStr}</td>
                    <td>${atResetStr}</td>
                    <td>${escapeHtml(resetsStr)}</td>
                    <td>${statusStr}</td>
                    <td>${lastSampleStr}</td>
                `;
                tbody.appendChild(tr);

                const badgeText = isDis ? 'disabled' : `${leftStr} left`;
                const badgeClass = isDis ? 'badge badge-disabled' : 'badge';

                const isShort = rep.window_secs != null && rep.window_secs < 86400;
                const rangeHtml = isDis ? '' : (isShort ? `
                    <div class="range-toggle" role="group" aria-label="Time range" data-idx="${idx}">
                        <button type="button" class="range-btn active" data-range="5h" aria-pressed="true">5h</button>
                        <button type="button" class="range-btn" data-range="24h" aria-pressed="false">24h</button>
                        <button type="button" class="range-btn" data-range="7d" aria-pressed="false">7d</button>
                        <button type="button" class="range-btn" data-range="30d" aria-pressed="false">30d</button>
                    </div>
                ` : `
                    <div class="range-toggle" role="group" aria-label="Time range" data-idx="${idx}">
                        <button type="button" class="range-btn active" data-range="7d" aria-pressed="true">7d</button>
                        <button type="button" class="range-btn" data-range="30d" aria-pressed="false">30d</button>
                        <button type="button" class="range-btn" data-range="all" aria-pressed="false">All</button>
                    </div>
                `);

                const card = document.createElement('div');
                card.className = 'chart-card';
                card.innerHTML = `
                    <div class="chart-header">
                        <div class="chart-title">${escapeHtml(title)}</div>
                        ${rangeHtml}
                        <span class="${badgeClass}">${escapeHtml(badgeText)}</span>
                    </div>
                    <div class="chart-box">
                        <canvas class="bucket-chart" data-idx="${idx}"></canvas>
                    </div>
                `;
                grid.appendChild(card);

                const canvas = card.querySelector('canvas');
                const datasets = [];

                const nowMs = !isNaN(genDate.getTime()) ? genDate.getTime() : Date.now();
                const resetMs = rep.reset_time ? new Date(rep.reset_time).getTime() : NaN;
                const rawLastMs = p.last_sample ? new Date(p.last_sample).getTime() : NaN;
                const lastSampleMs = !isNaN(rawLastMs) ? rawLastMs : nowMs;
                const endMs = (!isNaN(resetMs) && resetMs > nowMs) ? resetMs : Math.max(nowMs, lastSampleMs);
                const rawMin = endMs - (isShort ? 5 * 3600 * 1000 : 7 * 86400 * 1000);
                const initialMin = Math.min(rawMin, lastSampleMs);

                // Actual series
                const allActualPts = (rep.series || []).map(pt => ({ x: pt[0], y: pt[1] * 100 }));
                const actualPointRadius = pts => (pts.length === 1 ? 2 : 0);
                let actualDataset = null;
                if (allActualPts.length > 0) {
                    const initialActualPts = allActualPts.filter(pt => pt.x >= initialMin);
                    actualDataset = {
                        label: 'Actual',
                        data: initialActualPts,
                        borderColor: '#38bdf8',
                        backgroundColor: '#38bdf8',
                        borderWidth: 2,
                        borderJoinStyle: 'round',
                        borderCapStyle: 'round',
                        pointRadius: actualPointRadius(initialActualPts),
                        pointHoverRadius: 4,
                        tension: 0,
                    };
                    datasets.push(actualDataset);
                }

                // Budget line
                if (rep.window_start && rep.reset_time) {
                    datasets.push({
                        label: 'Budget',
                        data: [
                            { x: new Date(rep.window_start).getTime(), y: 100 },
                            { x: new Date(rep.reset_time).getTime(), y: 0 }
                        ],
                        borderColor: '#64748b',
                        borderWidth: 1.5,
                        borderDash: [4, 4],
                        pointRadius: 0,
                    });
                }

                // Projection
                if (p.rate_per_h != null && p.rate_per_h >= 0) {
                    const startX = new Date(p.last_sample).getTime();
                    const startY = p.remaining_now * 100;
                    let endX, endY;
                    if (p.empty_at) {
                        endX = new Date(p.empty_at).getTime();
                        endY = 0;
                    } else {
                        endX = new Date(p.reset_time).getTime();
                        endY = (p.at_reset || 0) * 100;
                    }
                    if (endX > startX) {
                        const projColor = p.status === 'WillRunOut' ? '#ef4444' : (p.status === 'Tight' ? '#f59e0b' : '#10b981');
                        datasets.push({
                            label: 'Projection',
                            data: [
                                { x: startX, y: startY },
                                { x: endX, y: endY }
                            ],
                            borderColor: projColor,
                            borderWidth: 2,
                            borderDash: [6, 4],
                            pointRadius: 0,
                        });
                    }
                }

                if (isDis) {
                    const box = card.querySelector('.chart-box');
                    box.style.display = 'flex';
                    box.style.flexDirection = 'column';
                    box.style.alignItems = 'center';
                    box.style.justifyContent = 'center';
                    box.style.color = 'var(--text-dim)';
                    box.style.fontSize = '0.95rem';
                    box.style.border = '1px dashed var(--border)';
                    box.style.borderRadius = '6px';
                    box.innerHTML = '<strong style="color:var(--text);font-size:1.05rem;margin-bottom:0.25rem;">Disabled</strong><span>Weekly limit reached</span>';
                } else if (typeof Chart !== 'undefined') {
                    const chart = new Chart(canvas, {
                        type: 'line',
                        data: { datasets },
                        options: {
                            parsing: false,
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'nearest', axis: 'x', intersect: false },
                            scales: {
                                x: {
                                    type: 'time',
                                    time: chartTimeOptions(),
                                    min: initialMin,
                                    max: endMs,
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                    ticks: { color: '#94a3b8' }
                                },
                                y: {
                                    min: 0,
                                    max: 100,
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                    ticks: {
                                        color: '#94a3b8',
                                        callback: v => v + '%'
                                    }
                                }
                            },
                            plugins: {
                                decimation: {
                                    enabled: true,
                                    algorithm: 'min-max',
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (ctx) => {
                                            const label = ctx.dataset.label ? `${ctx.dataset.label}: ` : '';
                                            return ctx.parsed?.y != null ? `${label}${ctx.parsed.y.toFixed(1)}%` : label;
                                        }
                                    }
                                },
                                legend: {
                                    labels: { color: '#94a3b8', boxWidth: 12 }
                                },
                                boundaries: {
                                    display: true,
                                    dates: Array.from(new Set([
                                        ...(rep.boundaries || []),
                                        ...(rep.reset_time ? [rep.reset_time] : [])
                                    ])).map(d => new Date(d).getTime()).filter(t => !isNaN(t))
                                }
                            }
                        }
                    });
                    chartInstances.push(chart);

                    const toggleContainer = card.querySelector('.range-toggle');
                    if (toggleContainer) {
                        toggleContainer.addEventListener('click', (e) => {
                            const btn = e.target.closest('.range-btn');
                            if (!btn || btn.classList.contains('active')) return;

                            const range = btn.dataset.range;
                            let handled = true;

                            if (range === '5h') {
                                chart.options.scales.x.min = Math.min(endMs - 5 * 3600 * 1000, lastSampleMs);
                                chart.options.scales.x.max = endMs;
                                if (isShort) chart.options.plugins.boundaries.display = true;
                            } else if (range === '24h') {
                                chart.options.scales.x.min = Math.min(endMs - 24 * 3600 * 1000, lastSampleMs);
                                chart.options.scales.x.max = endMs;
                                if (isShort) chart.options.plugins.boundaries.display = true;
                            } else if (range === '7d') {
                                chart.options.scales.x.min = Math.min(endMs - 7 * 86400 * 1000, lastSampleMs);
                                chart.options.scales.x.max = endMs;
                                chart.options.plugins.boundaries.display = !isShort;
                            } else if (range === '30d') {
                                chart.options.scales.x.min = Math.min(endMs - 30 * 86400 * 1000, lastSampleMs);
                                chart.options.scales.x.max = endMs;
                                chart.options.plugins.boundaries.display = !isShort;
                            } else if (range === 'all') {
                                delete chart.options.scales.x.min;
                                chart.options.scales.x.max = endMs;
                                chart.options.plugins.boundaries.display = false;
                            } else {
                                handled = false;
                            }

                            if (handled) {
                                if (actualDataset) {
                                    const minX = chart.options.scales.x.min;
                                    const visiblePts = minX != null
                                        ? allActualPts.filter(pt => pt.x >= minX)
                                        : allActualPts;
                                    if (actualDataset._decimated) {
                                        delete actualDataset._decimated;
                                        delete actualDataset._data;
                                        Object.defineProperty(actualDataset, 'data', {
                                            configurable: true,
                                            enumerable: true,
                                            writable: true,
                                            value: visiblePts
                                        });
                                    } else {
                                        actualDataset.data = visiblePts;
                                    }
                                    actualDataset.pointRadius = actualPointRadius(visiblePts);
                                }
                                toggleContainer.querySelectorAll('.range-btn').forEach(b => {
                                    const isActive = b === btn;
                                    b.classList.toggle('active', isActive);
                                    b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                                });
                                clearSyncedCrosshair(null);
                                chart.update('none');
                            }
                        });
                    }
                } else {
                    const box = card.querySelector('.chart-box');
                    box.style.display = 'flex';
                    box.style.alignItems = 'center';
                    box.style.justifyContent = 'center';
                    box.style.color = 'var(--text-dim)';
                    box.style.fontSize = '0.875rem';
                    box.style.border = '1px dashed var(--border)';
                    box.style.borderRadius = '4px';
                    box.textContent = 'Charts unavailable offline (Chart.js CDN unreached)';
                }
            });

            function updateRelativeTimes() {
                const now = Date.now();
                if (metaEl && data && data.generated_at) {
                    const gDate = new Date(data.generated_at);
                    metaEl.textContent = `Generated: ${gDate.toLocaleString(undefined, TIME_OPTS)} (${formatTimeAgo(gDate)})`;
                }
                const rows = tbody.querySelectorAll('tr');
                rows.forEach((tr, i) => {
                    const rep = data.reports && data.reports[i];
                    if (!rep) return;
                    const p = rep.prognosis;
                    if (tr.cells[5]) {
                        tr.cells[5].textContent = formatResetCell(rep.reset_time, p.status === 'Disabled', now);
                    }
                    if (tr.cells[6]) {
                        tr.cells[6].textContent = statusLabel(p.status, p.empty_at, now);
                    }
                    if (tr.cells[7]) {
                        const lDate = new Date(p.last_sample);
                        tr.cells[7].textContent = `${lDate.toLocaleTimeString(undefined, TIME_OPTS)} (${formatTimeAgo(lDate)})`;
                    }
                });
            }
            setInterval(updateRelativeTimes, 30000);
        });
    </script>
</body>
</html>
