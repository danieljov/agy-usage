[package]
name = "agy-usage"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Quota history, burn-rate prognosis, and interactive TUI/HTML dashboards for Google Antigravity"
repository = "https://github.com/danieljov/agy-usage"
homepage = "https://danieljov.github.io/agy-usage"
readme = "README.md"
keywords = ["antigravity", "quota", "tui", "dashboard", "cli"]
categories = ["command-line-utilities"]
exclude = [
    ".github/",
    "docs/",
    "assets/screenshots/",
    "install.sh",
]

[profile.release]
strip = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"

[dev-dependencies]

[[bin]]
name = "agy-usage"
path = "src/main.rs"

# Run the demo generator's unit tests as part of `cargo test` so the
# GitHub Pages build input is verified in CI.
[[example]]
name = "generate_demo"
test = true
