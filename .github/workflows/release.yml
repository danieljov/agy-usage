name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-release:
    name: Build & Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VER=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agy-usage") | .version')
          if [ "${TAG}" != "v${PKG_VER}" ]; then
            echo "::error::Git tag '${TAG}' does not match Cargo.toml version 'v${PKG_VER}'"
            exit 1
          fi

      - name: Check formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --release --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/agy-usage

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCH="x86_64-unknown-linux-gnu"
          DIST_DIR="agy-usage-${TAG}-${ARCH}"
          mkdir -p "${DIST_DIR}"
          cp target/release/agy-usage "${DIST_DIR}/"
          cp LICENSE README.md "${DIST_DIR}/"
          tar -czvf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agy-usage-*.tar.gz
            agy-usage-*.tar.gz.sha256
          generate_release_notes: true

      - name: Clean up release artifacts and check crates.io index
        id: crates-check
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          rm -rf agy-usage-*
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
          fi
          PKG_VER=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agy-usage") | .version')
          echo "pkg_ver=${PKG_VER}" >> "${GITHUB_OUTPUT}"
          if curl -fsSL "https://index.crates.io/ag/y-/agy-usage" 2>/dev/null | jq -e --arg v "${PKG_VER}" 'select(.vers == $v)' >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::agy-usage v${PKG_VER} is already published on crates.io; skipping."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-auth
        if: steps.crates-check.outputs.already_published != 'true' && steps.crates-check.outputs.has_token != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true

      - name: Publish to crates.io
        if: steps.crates-check.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
          PKG_VER: ${{ steps.crates-check.outputs.pkg_ver }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Neither CARGO_REGISTRY_TOKEN secret nor Crates.io Trusted Publishing token is available"
            exit 1
          fi
          set +e
          OUT=$(cargo publish --locked 2>&1)
          STATUS=$?
          set -e
          echo "${OUT}"
          if [ "${STATUS}" -ne 0 ]; then
            if echo "${OUT}" | grep -qiE "already uploaded|already exists"; then
              echo "::notice::agy-usage v${PKG_VER} was already published on crates.io."
              exit 0
            fi
            exit "${STATUS}"
          fi
