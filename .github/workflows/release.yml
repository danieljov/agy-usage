name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VER=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agy-usage") | .version')
          if [ "${TAG}" != "v${PKG_VER}" ]; then
            echo "::error::Git tag '${TAG}' does not match Cargo.toml version 'v${PKG_VER}'"
            exit 1
          fi

      - name: Check formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --release --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/agy-usage

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCH="x86_64-unknown-linux-gnu"
          DIST_DIR="agy-usage-${TAG}-${ARCH}"
          mkdir -p "${DIST_DIR}"
          cp target/release/agy-usage "${DIST_DIR}/"
          cp LICENSE README.md "${DIST_DIR}/"
          tar -czvf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agy-usage-*.tar.gz
            agy-usage-*.tar.gz.sha256
          generate_release_notes: true
